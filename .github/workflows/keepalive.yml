name: Render 24/7 Keep-Alive Sentinel

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping QuantMatrix AI API
        run: |
          curl -s -S -o /dev/null -w "Health: %{http_code} (%{time_total}s)\n" https://quantmatrix-ai-api.onrender.com/health
          curl -s -S -o /dev/null -w "Signals: %{http_code} (%{time_total}s)\n" "https://quantmatrix-ai-api.onrender.com/api/v1/signals/directional?symbol=BTCUSDT"
          curl -s -S -o /dev/null -w "Wick: %{http_code} (%{time_total}s)\n" https://quantmatrix-ai-api.onrender.com/api/v1/signals/wick-sniper
