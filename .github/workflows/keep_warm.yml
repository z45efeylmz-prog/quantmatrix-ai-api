name: Keep Vercel API Warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health to prevent cold starts
        run: |
          curl -fsS --max-time 20 -w "\nHTTP %{http_code} in %{time_total}s\n" https://quantmatrix-ai-api.vercel.app/health
